; Single-player Battleship. Random fleet layout each episode, one shot per step,
; already-fired squares removed by the action mask.
;
; Run:   ./build.sh battleship build/puffer_battleship
;        ./build/puffer_battleship train
;        ./build/puffer_battleship sweep
;
; The [env], [policy] and [train] values below are sweep trial 0058 of a 60-run
; sweep, score 0.3949 (43.0 shots to clear) against 0.3830 for the hand-picked
; baseline it replaced. Its learning curve was still creeping at the end
; (0.3933 -> 0.3949 over the last fifth), so a longer run should gain a little.

[base]
env_name = battleship

[vec]
; 8192 over 4096 and num_buffers 4 over 2 are throughput, not learning: measured
; 3.3M / 3.7M / 4.5M SPS on a 3070 for 4096+2 / 8192+2 / 8192+4. The env is only
; ~28% of an iteration (model 53%), so more agents amortize the model better.
total_agents = 8192
num_buffers = 4
num_threads = 16

[env]
grid_size = 10
; Comma list, parsed by src/ini.h into DictItem.values. Classic fleet, 17 cells.
ship_sizes = 5,4,3,3,2
; With the action mask on, max_steps >= grid_size^2 means every episode ends by
; clearing the board, so score is always a real shots-to-clear number.
max_steps = 100
; hit_reward is the scale anchor and is deliberately NOT swept: only the ratios
; between the four terms matter, and overall scale is absorbed by learning_rate
; and vf_coef.
hit_reward = 1.0
miss_reward = -0.3
sink_reward = 2.82991004
win_reward = 2.50208402

[policy]
hidden_size = 128
; 1 layer won unanimously: all 8 top trials of the second sweep took it, partial
; rho -0.91, and the first sweep agreed at -0.83. The axis is pinned off below.
num_layers = 1

[train]
gpus = 1
seed = 42
total_timesteps = 218233568
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.941518784
gae_lambda = 0.354434371
replay_ratio = 6.6608777
clip_coef = 0.174257994
vf_coef = 3.10313654
vf_clip_coef = 0.801042318
max_grad_norm = 0.974838018
ent_coef = 0.00083196623
momentum = 0.95
minibatch_size = 16384
horizon = 16

; --- sweep -------------------------------------------------------------------
; ./build/puffer_battleship sweep
;
; Objective. env/score is shots efficiency, ship_cells / shots_to_clear. It is
; NOT episode_return, which matters here because the sweep moves reward weights:
; eval_loop hardcodes env/score (pufferl.cu:2887) for a trial's final value and
; sweep.metric only steers the intermediate curve points, so a reward-weighted
; objective would let a trial win by paying itself more per hit.
;
; Scale: ~0.18 is uniform random over the unfired squares, ~0.39 is where this
; config lands, and roughly 0.41 is the practical ceiling -- a Bayes-optimal
; player still averages ~41-42 shots because it has to spend misses to find the
; ships. 1.0 means 17 shots and 17 hits, which requires knowing the layout in
; advance, so the metric is bounded well below 1 by information, not by skill.
;
; Shape constraints, all satisfied by construction below (pufferl.cu:3306):
;   * minibatch_size % horizon == 0            -- both powers of two, mb >= 4096
;   * minibatch_size <= horizon * total_agents -- 32768 <= 16 * 8192
;   * total_agents % (minibatch_size/horizon)  -- 8192 % (<=2048 pow2)
;   * horizon % 8 == 0 (ADV_VEC_WIDTH, bf16)   -- horizon min is 16
;
; And one the trainer does NOT check. train_impl captures a whole training epoch
; into a single CUDA graph, so its size is
;
;     replay_ratio * horizon * total_agents / minibatch_size
;
; and cudaGraphInstantiate refuses somewhere between 1536 and 2048 (bisected:
; 1536/1024/768/512 instantiate, 2048/3072/4096/6144 fail). A trial that trips it
; dies and is reaped as a "fail" observation, which happened once in 60 runs
; before these bounds. The worst corner below is 12 * 32 * 8192 / 4096 = 768,
; half the last known-good value. Widen replay_ratio or horizon, or lower the
; minibatch floor, and check this product first.
;
; A caution on reading the numbers in these comments: 60 trials over 16 axes is
; under 4 observations per dimension, and the two sweeps run so far disagreed on
; several axes once the bounds moved -- minibatch_size and replay_ratio both
; looked decisive in the first run purely because they were pinned against their
; own walls, and win_reward wanted to be large in the first run and ~0 in the
; second. Rails are trustworthy, correlations much less so.
;
; distribution: uniform | int_uniform | uniform_pow2 | log_normal | logit_normal
; scale: auto (0.5), time (the cost axis), or a number.
[sweep]
metric = score
metric_distribution = logit
goal = maximize
max_runs = 60
downsample = 5
prune_pareto = True
early_stop_quantile = 0.3
gpus = 1
; The GP would share the one 3070 with the trial it is scoring.
use_gpu = False
max_suggestion_cost = 600

; The cost axis -- run_sweep only sets space->cost_idx for this exact section.
; The top 8 landed at 1.6e8-2.9e8, inside this range and away from both ends.
[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 5e8
scale = time

; Floor dropped from 1e-3, which the top 8 railed against (all of them inside
; 0.001-0.0015, partial rho -0.35). Ceiling pulled in from 0.05 for the same
; reason: nothing above 0.0015 placed. Note lr trades against updates per epoch
; (replay_ratio * horizon * agents / minibatch), so read a move here together
; with those.
[sweep.train.learning_rate]
distribution = log_normal
min = 1e-4
max = 1e-2
scale = 0.5

; Ceiling pulled in from 0.05; the top 8 sat at 4.5e-4..9.5e-3 (partial -0.38).
[sweep.train.ent_coef]
distribution = log_normal
min = 1e-4
max = 1e-2
scale = auto

; Floor dropped from 0.9, which the top 8 railed against. Episodes are ~43 steps
; with a dense per-step hit/miss reward, so there is little to discount for.
[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

; Floor dropped again, from 0.2. Same story as gamma: heavy bootstrapping wins
; on a short dense-reward episode.
[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.05
max = 0.9
scale = auto

; Flat in the second sweep (+0.17, top 8 spanning the whole 1-12 range) after
; looking decisive in the first, where it was railing against a ceiling of 4.
; Kept wide, but it is now a candidate to pin if it stays flat.
[sweep.train.replay_ratio]
distribution = uniform
min = 1.0
max = 12.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.1
max = 0.5
scale = auto

; Ceiling raised from 1.0: the top 8 sat at 0.61-1.00.
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 2.0
scale = auto

; Ceiling raised from 4.0, which the top 8 railed against (2.97-4.00).
[sweep.train.vf_coef]
distribution = uniform
min = 0.5
max = 8.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2.5
scale = auto

; Ceiling cut from 64: no top-8 trial used it, they split 16/32. That also buys
; the CUDA graph headroom described above. The Markov prediction held -- the
; observation fully describes the board, so nothing needs carrying across steps
; and the policy wants the shortest legal BPTT window.
[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 32
scale = auto

; Floor raised from 1024. The first sweep's rail at 8192 was an artifact of that
; being its floor; given room, the winners went the other way (4096-32768). 4096
; keeps every value the top 8 actually used and bounds the graph size.
[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

; --- reward shaping ----------------------------------------------------------
; Safe to sweep only because the objective is reward-invariant (see above).
; hit_reward stays pinned at 1.0 as the scale anchor; these three are ratios
; against it.

; Floor dropped from -0.3, which the top 8 railed against (-0.30..-0.23, partial
; -0.55, the strongest of the three). A bigger miss penalty sharpens the
; contrast between the two outcomes the policy can actually control.
[sweep.env.miss_reward]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

; Ceiling raised from 3.0; the top 8 sat at 1.0-3.0 (partial +0.31). So the sink
; bonus is doing something after all -- the first sweep's raw rho of +0.02 was
; the budget axis cancelling it out.
[sweep.env.sink_reward]
distribution = uniform
min = 0.0
max = 6.0
scale = auto

; Narrowed from 15. This axis flipped between sweeps: it leaned high at +0.35 in
; the first and railed at ~0 in the second (-0.44), which is the clearest
; evidence in this file that single-sweep correlations here are weak.
[sweep.env.win_reward]
distribution = uniform
min = 0.0
max = 6.0
scale = auto

; --- axes inherited from default.ini that this env does not sweep -------------
; distribution = off drops an axis; a child ini cannot delete an inherited
; section, and pinning min == max makes space_normalize divide by zero.

; Pinned at 8192 on throughput grounds (see [vec]).
[sweep.vec.total_agents]
distribution = off

; Pinned at 1 layer -- see [policy]. Unanimous across both sweeps.
[sweep.policy.num_layers]
distribution = off

; Muon's momentum. 0.95 across every run here.
[sweep.train.momentum]
distribution = off
