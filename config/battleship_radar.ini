; Battleship with a radar. As ocean/battleship, plus a sweep action that reports
; how many ship cells sit in the 3x3 block around a square without saying which.
; Sweeps are free -- they are not turns and score ignores them -- but an episode
; only gets sweep_charges of them.
;
; Run:   ./build.sh battleship_radar build/puffer_battleship_radar
;        ./build/puffer_battleship_radar train
;        ./build/puffer_battleship_radar sweep
;
; The [env], [policy] and [train] values below are trial 0012 of a 60-trial
; sweep, score 0.5864 -- 30.2 shots to clear, against 43.2 for plain battleship.
; Five free 3x3 scans are therefore worth about 13 shots, or 2.6 shots each, and
; every top trial spent 4.96-4.99 of its 5 charges.
;
; Read the ordering inside the top ten with suspicion. Those trials span
; 0.5758-0.5864 and 30.1-30.7 shots, which is tight enough to be seed noise: the
; battleship sweep set exactly this trap, where a 0.3926-0.3949 top-ten spread
; turned out to be entirely noise once six seeds were run per config. Seed
; variance has NOT been measured for this env. Measure it before treating any
; difference of this size as real.

[base]
env_name = battleship_radar

[vec]
total_agents = 8192
num_buffers = 4
num_threads = 16

; --- do not bother optimizing the env ---------------------------------------
; Measured 2026-09-06 on a 3070, 20M-step runs with base.cudagraphs=-1 (the
; sub-timers are all 0 without it):
;
;   stage        before   after
;   Env            20ms     1ms      1%  ->  0%
;   Copy           22ms    20ms      1%      1%
;   Train/Model   732ms   580ms     54%     56%
;
; puf_step was rewritten to update the observation and mask incrementally
; instead of memsetting 2032 bytes and rescanning 100 cells every turn. That is
; 2.0-2.5x on the env alone (404K -> 7.3M steps/s standalone, single thread,
; measured by ocean/battleship_radar/equivalence.c) and 20x on the Env line
; above -- and it moved end-to-end SPS by nothing: 927K vs 914K over three
; paired runs, ranges overlapping. This trains GEMM-bound on a 140K-param model,
; exactly like ocean/captain_sonar, where the same rewrite bought 4.67x on the
; env and -2.4% of wall clock.
;
; A faster GPU is NOT the lever either. Measured 2026-09-06, 3 reps each at
; 20M steps, medians (single-run spread is ~10-19% at the light configs and
; collapses to <0.1% at the heavy ones, which is itself the tell):
;
;   hidden   params     SPS      time x   predicted
;      64     57.7K   1.20M       0.796     0.796
;     128    140.0K   0.956M      1.000     1.000
;     256    378.4K   0.607M      1.576     1.589
;     512      1.1M   0.292M      3.270     3.374
;
; Fitting T = fixed + compute*params to the 64/128 pair ALONE gives
; T = 0.654 + 0.346*params, which then predicts 256 to within 0.9% and 512 to
; within 3.2% across a 19x parameter range. So at the shipped hidden_size=128
; only ~35% of an iteration is work that scales with the model; ~65% is fixed.
;
; Amdahl on that 35%: infinite compute is 1.53x, and a 4090-class card (~4x the
; bf16 throughput of the 3070 this was measured on) is ~1.35x. Some of the
; "fixed" 65% is GPU work that does not scale with parameter count (GAE and
; elementwise kernels, graph replay, memory-bound traffic) and would improve
; somewhat on a newer card, so read ~1.35x as a floor and roughly 1.9x as an
; optimistic ceiling -- not the 3-4x the raw spec sheet suggests.
;
; CUDA graphs are worth ~6% here and should stay on (default cudagraphs = 1).
; Four interleaved pairs at 20M steps, graphs on won every one:
;   on   935.3K  968.3K  1.00M  940.8K   median 953K
;   off  899.5K  908.4K  892.8K          median 899K
; The off arm is much tighter (1.7% spread) while the on arm carries the
; jitter, which is what replay removing launch variability looks like. Note
; cudagraphs >= 0 ENABLES graphs (pufferl.cu:1799) -- only -1 disables, and 0
; does not. Reach for -1 only to get the profiler sub-timers, and treat those
; with suspicion: they came back empty (Evaluate 0ms / Train 100%) on 5 of 8
; runs on 2026-09-06.
;
; horizon is not a throughput lever either: 8/16/32/64 give 856K/949K/1.00M/992K,
; i.e. a SHORTER scan is slower, not faster. Epochs per run halve as horizon
; doubles (305/152/76/38), so what little there is comes from amortizing fewer,
; larger graph launches -- not from the MinGRU scan being latency-bound. The
; whole spread is ~16%, barely above the noise floor, and horizon also moves
; learning (see the note on the sweep bound below), so do not chase it.
;
; So hidden_size / num_layers / minibatch_size / replay_ratio are the levers,
; and all four are already swept axes below. Note this contradicts the ~28%
; figure quoted in config/battleship.ini; that was plain battleship and does not
; transfer.

[env]
grid_size = 10
; Comma list, parsed by src/ini.h into DictItem.values. Classic fleet, 17 cells.
ship_sizes = 5,4,3,3,2
; A bound on shots, not on actions -- sweeps do not count. With the mask on,
; 100 shots always clears the board, so it is unreachable and every episode ends
; solved.
max_steps = 100
; Free sweeps per episode. A difficulty setting, NOT a hyperparameter, and
; deliberately absent from the sweep block below: the 3x3 count map is an
; invertible box filter (see the header), so a trial handed enough charges to
; tile the board would read off the exact layout and score 1.0 without learning
; anything. 5 buys up to 45 cells of information, well short of that.
sweep_charges = 5
; hit_reward is the scale anchor and is deliberately NOT swept: only the ratios
; between the terms matter, and overall scale is absorbed by learning_rate and
; vf_coef.
hit_reward = 1.0
miss_reward = -0.451693177
sink_reward = 1.87339783
win_reward = 3.94480491
; The sweep wanted this positive: 8 of the top trials railed against the old
; +0.25 ceiling. Charges are use-it-or-lose-it, so paying the policy to spend
; them early beats letting gamma quietly argue against a step that banks no
; reward of its own.
sweep_reward = 0.0668581426

[policy]
hidden_size = 128
num_layers = 1

[train]
gpus = 1
seed = 42
total_timesteps = 283948416
learning_rate = 0.00237340946
anneal_lr = 1
min_lr_ratio = 0.0
gamma = 0.944228828
gae_lambda = 0.0500000119
replay_ratio = 8.45334244
clip_coef = 0.100000001
vf_coef = 4.14785862
vf_clip_coef = 0.722941518
max_grad_norm = 0.603247464
ent_coef = 0.000752515392
momentum = 0.95
minibatch_size = 8192
horizon = 16

; --- sweep -------------------------------------------------------------------
; ./build/puffer_battleship_radar sweep
;
; Objective. env/score is ship_cells / shots, and sweeps are not shots, so it is
; the same number ocean/battleship reports and the two envs are directly
; comparable: radar is only worth having if it scores above battleship's ~0.393.
; It is NOT episode_return, which matters because the sweep moves reward
; weights: eval_loop hardcodes env/score (pufferl.cu:2887) for a trial's final
; value and sweep.metric only steers the intermediate curve points, so a
; reward-weighted objective would let a trial win by paying itself more per hit.
;
; Scale: ~0.18 is uniform random firing, ~0.393 is what plain battleship reaches
; with these hyperparameters, and ~0.41 is the ceiling without radar. Under the
; earlier turn-costing rules the policy simply stopped sweeping and landed back
; on 0.393 (trial 0 of the archived sweep in logs/battleship_radar/turn_cost:
; sweeps/episode fell 6.54 -> 0.001 while score rose 0.343 -> 0.392). With the
; charges free that escape is gone -- not sweeping now strictly wastes them --
; so anything at or below 0.393 means the policy cannot turn a 3x3 count into a
; better shot, which is a statement about the observation, not the price.
;
; Shape constraints, all satisfied by construction below (pufferl.cu:3306):
;   * minibatch_size % horizon == 0            -- both powers of two, mb >= 4096
;   * minibatch_size <= horizon * total_agents -- 32768 <= 16 * 8192
;   * total_agents % (minibatch_size/horizon)  -- 8192 % (<=2048 pow2)
;   * horizon % 8 == 0 (ADV_VEC_WIDTH, bf16)   -- horizon min is 16
;
; And one the trainer does NOT check. train_impl captures a whole training epoch
; into a single CUDA graph, so its size is
;
;     replay_ratio * horizon * total_agents / minibatch_size
;
; and cudaGraphInstantiate refuses somewhere between 1536 and 2048 (bisected on
; battleship: 1536/1024/768/512 instantiate, 2048/3072/4096/6144 fail). The
; worst corner below is 20 * 32 * 8192 / 4096 = 1280, which is inside the last
; known-good value but no longer has much margin. Widen replay_ratio or horizon,
; or lower the minibatch floor, and recompute this product first.
;
; distribution: uniform | int_uniform | uniform_pow2 | log_normal | logit_normal
; scale: auto (0.5), time (the cost axis), or a number.
[sweep]
metric = score
metric_distribution = logit
goal = maximize
; Raised from 60 with num_layers reopened, so observations per dimension do not
; get worse by adding an axis. 17 axes at 80 trials is still under 5 per
; dimension -- read rails, not correlations.
max_runs = 80
downsample = 5
prune_pareto = True
early_stop_quantile = 0.3
gpus = 1
; The GP would share the one 3070 with the trial it is scoring.
use_gpu = False
max_suggestion_cost = 600

; The cost axis -- run_sweep only sets space->cost_idx for this exact section.
[sweep.train.total_timesteps]
distribution = log_normal
min = 5e7
max = 5e8
scale = time

; Ceiling raised from 1e-2, which two top trials sat on, though the axis is weak
; here (partial +0.17) and lr trades against updates per epoch (replay_ratio *
; horizon * agents / minibatch) -- read a move here together with those.
[sweep.train.learning_rate]
distribution = log_normal
min = 1e-4
max = 2e-2
scale = 0.5

; Floor dropped from 1e-4, which the top 8 railed against (1e-4..1.1e-3).
[sweep.train.ent_coef]
distribution = log_normal
min = 1e-5
max = 1e-2
scale = auto

; Flat: partial +0.02, the weakest axis in the sweep. A candidate to pin off if
; it stays flat on the next run.
[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

; Floor dropped from 0.05, which the top 8 railed against (partial -0.51). Same
; story as on battleship: short dense-reward episodes want heavy bootstrapping.
[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.01
max = 0.9
scale = auto

; Ceiling raised from 12, which the top 8 crowded (8.0-12, partial +0.36). 20 is
; as far as this can go before the CUDA graph limit above bites.
[sweep.train.replay_ratio]
distribution = uniform
min = 1.0
max = 20.0
scale = auto

; The strongest signal in the sweep. All 8 top trials sat exactly on the old 0.1
; floor, partial rho -0.71, so the floor was cutting off the optimum outright.
[sweep.train.clip_coef]
distribution = uniform
min = 0.02
max = 0.5
scale = auto

; Ceiling raised from 2.0; the top 8 sat at 0.50-2.00 (partial +0.40).
[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.05
max = 4.0
scale = auto

; Floor dropped from 0.5 (partial -0.39, top 8 from 0.58).
[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 8.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.5
max = 2.5
scale = auto

; 16 is a measured floor, not a guess: on battleship a paired 6-seed run of
; horizon 8 against 16 lost on 4 seeds and tied on 2, mean -0.0008.
[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 32
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

; Reopened from battleship's pinned 128. The observation is 508 floats instead
; of 308 and the head 200 instead of 100, so the width that fit the old env is
; not evidence for this one.
; Narrowed to 64/128 for this run, giving up the 256 that was present in the
; previous top 8. Two reasons: 256 costs 1.58x the wall clock of 128 and 512
; costs 3.27x (measured above), so the cheap end buys more trials per hour; and
; num_layers is open now, so extra capacity can come from depth instead of
; width. If the winner rails at 128, put 256 back.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 128
scale = auto

; --- reward shaping ----------------------------------------------------------
; Safe to sweep only because the objective is reward-invariant (see above).
; hit_reward stays pinned at 1.0 as the scale anchor; these are ratios to it.

[sweep.env.miss_reward]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

; Partial -0.42, with the top 8 spanning 0-2.4, so this wants to be small. The
; floor stays at 0 because it is a natural bound, not an artificial one: a
; negative sink bonus would pay the policy not to finish ships.
[sweep.env.sink_reward]
distribution = uniform
min = 0.0
max = 6.0
scale = auto

[sweep.env.win_reward]
distribution = uniform
min = 0.0
max = 6.0
scale = auto

; Ceiling raised from 0.25, which most of the top 8 railed against (partial
; +0.48). Safe to widen despite being a reward term: the objective is
; reward-invariant, and the total bonus is capped at sweep_charges * this.
[sweep.env.sweep_reward]
distribution = uniform
min = -0.25
max = 1.0
scale = auto

; --- axes inherited from default.ini that this env does not sweep -------------
; distribution = off drops an axis; a child ini cannot delete an inherited
; section, and pinning min == max makes space_normalize divide by zero.

; Pinned at 8192 on throughput grounds.
[sweep.vec.total_agents]
distribution = off

; Reopened 2026-09-06. It had been pinned at 1 because that was "unanimous
; across both battleship sweeps" -- but that is plain battleship's evidence, and
; this file already argues right above that battleship's width does not transfer
; here for exactly the reasons that apply to depth: the observation is 508
; floats instead of 308 and the head 200 instead of 100. Radar also asks for
; more than hunt/target, since spending a sweep means propagating 3x3 count
; constraints across the board. default.ini and breakout both use 4 layers, so
; 1 is unusual for this stack and was never tested on this env.
[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 4
scale = auto

; Muon's momentum. 0.95 across every run here.
[sweep.train.momentum]
distribution = off
